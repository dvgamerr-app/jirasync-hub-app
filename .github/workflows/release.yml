name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─── Step 1: Generate changelog from git history ─────────────────────────
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history for changelog

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

  # ─── Step 2: Build for each platform and publish release ─────────────────
  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel in one file)
          - platform: macos-latest
            args: --target universal-apple-darwin

          # Linux (AppImage + deb)
          - platform: ubuntu-22.04
            args: ""

          # Windows (NSIS installer + MSI + standalone EXE)
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      # ── Node.js runtime via Bun ──────────────────────────────────────────
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Sync app version from Git tag
        run: bun run sync:version -- "${{ github.ref_name }}"

      # ── Rust toolchain ───────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both macOS targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Cache Rust artifacts to speed up subsequent builds
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system libs ────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: bun install

      # ── Unittest ─────────────────────────────────────────────────────────
      - name: Test before build
        run: bun test --isolate

      # ── Build + create/update GitHub Release ─────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

          # ── macOS ad-hoc signing (no Apple Developer cert required) ─────
          APPLE_SIGNING_IDENTITY: "-"

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JiraSync Hub ${{ github.ref_name }}"
          releaseBody: ${{ needs.changelog.outputs.body }}
          # Keep the release hidden until every matrix job has uploaded its
          # updater metadata. Publishing early can expose a latest.json that
          # temporarily has no entry for a platform that is still building.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }} # e.g. v1.0.0-beta → prerelease
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: ${{ matrix.args }}

      # Build separately so the standalone binary has no installer bundle type.
      - name: Build standalone Windows EXE
        if: matrix.platform == 'windows-latest'
        run: bun tauri build --no-bundle

      # Upload only the plain binary; tauri-action would rediscover installers
      # left in target/release/bundle by the first build and upload them again.
      - name: Upload standalone Windows EXE
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $assetName = "$($config.productName)_$($config.version)_windows_x64.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName
          Copy-Item -LiteralPath 'src-tauri/target/release/jirasync-hub-app.exe' -Destination $assetPath
          gh release upload "$env:GITHUB_REF_NAME" "$assetPath" --repo "$env:GITHUB_REPOSITORY" --clobber

  # ─── Step 3: Publish only after every platform is ready ─────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
