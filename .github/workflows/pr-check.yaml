name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── Frontend: typecheck, lint, test + coverage, build ────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Type check
        run: bun x tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Requires the repo to be connected on Qlty Cloud; harmless no-op
      # otherwise, so it never blocks the PR on its own.
      - name: Publish coverage to Qlty
        if: always()
        continue-on-error: true
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info

  # ─── Frontend e2e: Playwright drives the real UI against a fake Jira ──────
  # No Tauri runtime or real Jira is needed: `vite --mode e2e` swaps the Tauri
  # APIs for browser shims (see e2e/shims) and requests go to e2e/fake-jira.ts.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: DEBUG vite probe (temporary)
        continue-on-error: true
        run: |
          (DEBUG='vite:*' bun x --bun vite --mode e2e --host 127.0.0.1 --port 1425 > /tmp/vite.log 2>&1 &)
          sleep 10
          curl -sv -m 40 http://127.0.0.1:1425/ 2>&1 | head -30 || true
          echo "--- vite log"; tail -60 /tmp/vite.log
          pkill -f 'vite --mode e2e' || true

      - name: Playwright tests
        env:
          DEBUG: pw:webserver
        run: bun run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # ─── Rust: cargo check ─────────────────────────────────────────────────────
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # ─── Qlty: linters, code smells, and metrics on the PR diff ───────────────
  qlty:
    runs-on: ubuntu-latest
    env:
      QLTY_UPSTREAM: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # qlty needs base branch history to diff against

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qlty CLI
        uses: qltysh/qlty-action/install@v1

      - name: Qlty check (new issues only)
        run: >
          qlty check --upstream "$QLTY_UPSTREAM"
          --filter=actionlint,clippy,eslint,osv-scanner,prettier,radarlint-js,rustfmt,trufflehog

      # zizmor flags every unpinned `uses:` tag (this repo's existing style),
      # so it stays informational instead of blocking every PR that touches
      # a workflow file.
      - name: Qlty check - zizmor (informational)
        continue-on-error: true
        run: qlty check --upstream "$QLTY_UPSTREAM" --filter=zizmor

      - name: Qlty smells (informational)
        continue-on-error: true
        run: qlty smells --upstream "$QLTY_UPSTREAM"

      - name: Qlty metrics (informational)
        continue-on-error: true
        run: qlty metrics --upstream "$QLTY_UPSTREAM"
