config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "clippy"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = [
  "eslint",
  "@eslint/js",
  "globals",
  "eslint-plugin-react-hooks",
  "eslint-plugin-react-refresh",
  "typescript-eslint",
  "jest",
  "prettier",
]

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier", "prettier-plugin-tailwindcss", "tailwindcss", "tailwindcss-animate"]

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"
mode = "comment"

[[plugin]]
name = "rustfmt"

[[plugin]]
name = "radarlint-js"

# Baseline: existing findings tracked as separate hardening work, not fixed in the
# PR that introduced the Qlty gate.
[[exclude]]
plugins = ["zizmor"]
file_patterns = [".github/workflows/release.yml"]

[[exclude]]
plugins = ["osv-scanner"]
file_patterns = ["src-tauri/Cargo.lock"]

[[exclude]]
plugins = ["eslint"]
file_patterns = ["vitest.config.ts"]

# radarlint-js findings (complexity, deprecations, style) on existing code; not
# reproducible in the local Windows run, surfaced only on CI.
[[exclude]]
plugins = ["radarlint-js"]
file_patterns = ["src/**"]
