[package]
name = "jirasync-hub-app"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wedo_jirasync_hub_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2.8.1"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-window-state = "2"
machine-uid = "0.6"
aes-gcm = "0.11"
sha2 = "0.11.0"
base64 = "0.23"
serde_json = "1"

# OS credential stores. Linux (Secret Service needs libdbus) is intentionally left out: the
# commands report "unsupported" there and the frontend keeps its encrypted-blob fallback.
[target."cfg(windows)".dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSWindow", "objc2-core-foundation"] }
